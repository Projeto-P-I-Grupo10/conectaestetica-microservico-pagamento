spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/conectaEstatica}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:$password$}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.web.error.include-binding-errors=always
spring.web.error.include-message=always

# Mercado Pago
mercadopago.access-token=${MP_ACCESS_TOKEN:}
mercadopago.pix.expiracao-minutos=${PIX_EXPIRACAO_MINUTOS:10}

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:myuser}
spring.rabbitmq.password=${RABBITMQ_PASS:secret}

app.rabbitmq.exchange=${RABBITMQ_EXCHANGE:pagamentos.exchange}
app.rabbitmq.queue.pagamento-criado=${RABBITMQ_QUEUE_PAGAMENTO_CRIADO:pagamento.criado.queue}
app.rabbitmq.routingkey.pagamento-criado=${RABBITMQ_ROUTINGKEY_PAGAMENTO_CRIADO:pagamento.criado}

# Dead Letter (DLX/DLQ) para mensagens que falham no processamento
app.rabbitmq.dlx=${RABBITMQ_DLX:pagamentos.dlx}
app.rabbitmq.queue.pagamento-criado-dlq=${RABBITMQ_QUEUE_PAGAMENTO_CRIADO_DLQ:pagamento.criado.dlq}
app.rabbitmq.routingkey.pagamento-criado-dlq=${RABBITMQ_ROUTINGKEY_PAGAMENTO_CRIADO_DLQ:pagamento.criado.dlq}

